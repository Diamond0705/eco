services:
  db:
    image: postgres:16
    container_name: ecologist_db
    environment:
      POSTGRES_DB: ecologist
      POSTGRES_USER: ecologist
      POSTGRES_PASSWORD: ecologist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  minio:
    image: minio/minio
    container_name: ecologist_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-ecologist}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-ecologist-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
