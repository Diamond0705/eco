services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecologist}
      POSTGRES_USER: ${POSTGRES_USER:-ecologist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecologist}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-ecologist}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-ecologist-password}
    volumes:
      - minio_data:/data
    # Published for local Phase 18 verification only.
    # For real production, close these ports or move them to a private override.
    ports:
      - "9000:9000"
      - "9001:9001"

  web:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ecologist}:${POSTGRES_PASSWORD:-ecologist}@db:5432/${POSTGRES_DB:-ecologist}
      USE_S3_STORAGE: "True"
      AWS_S3_ENDPOINT_URL: http://minio:9000
      USE_X_FORWARDED_PROTO: "True"
    command: ["waitress-serve", "--listen=0.0.0.0:8000", "config.wsgi:application"]
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - static_data:/app/staticfiles
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro

volumes:
  postgres_data:
  minio_data:
  static_data:
