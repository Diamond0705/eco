{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}EcoLogist{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Основная навигация">
            <a class="site-logo" href="/">EcoLogist</a>
            <span class="site-subtitle">Учебное планирование грузоперевозок</span>
        </nav>
    </header>
    <main class="site-main">
        {% block content %}
            <section class="intro">
                <h1>EcoLogist</h1>
                <p>Стартовый скелет проекта готов к дальнейшей реализации MVP.</p>
            </section>
        {% endblock %}
    </main>
</body>
</html>
