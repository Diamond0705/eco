upstream ecologist_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location @django {
        proxy_pass http://ecologist_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /api/ {
        try_files /__never_exists__ @django;
    }

    location ~ ^/admin/(dashboard|archive|users|transports|locations|eco-standards|calculation-settings|profile)/?$ {
        try_files $uri $uri/ /index.html;
    }

    location /admin/ {
        try_files /__never_exists__ @django;
    }

    location /healthz/ {
        try_files /__never_exists__ @django;
    }

    location /accounts/ {
        try_files /__never_exists__ @django;
    }

    location = /profile/avatar/ {
        try_files /__never_exists__ @django;
    }

    location = /profile/avatar/upload/ {
        try_files /__never_exists__ @django;
    }

    location = /profile/avatar/delete/ {
        try_files /__never_exists__ @django;
    }

    location = /reports/archive/ {
        try_files /__never_exists__ @django;
    }

    location ~ ^/reports/archive/[0-9]+/(download|delete)/$ {
        try_files /__never_exists__ @django;
    }

    location = /reports/emissions/pdf/ {
        try_files /__never_exists__ @django;
    }

    location = /reports/emissions/pdf/archive/ {
        try_files /__never_exists__ @django;
    }

    location = /reports/emissions/xlsx/ {
        try_files /__never_exists__ @django;
    }

    location = /reports/emissions/xlsx/archive/ {
        try_files /__never_exists__ @django;
    }

    location = /trips/export/xlsx/ {
        try_files /__never_exists__ @django;
    }

    location = /trips/export/xlsx/archive/ {
        try_files /__never_exists__ @django;
    }

    location ~ ^/trips/[0-9]+/(waybill|waybill/archive|start|deliver)/$ {
        try_files /__never_exists__ @django;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
